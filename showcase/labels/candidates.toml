[[candidate]]
id = "seed-retry-key"
commit = "Preserve payment retry identity"
area = "domain"
by = "agent"
on = 2026-10-21
note = """
A sound question: one right option, the other two clearly wrong. Its \
criterion 2 asks for more than the question needs: the stem asks what makes \
every attempt carry the same key, and why that matters to the provider is \
the "why it matters" line, not a reason the answer key is right (#135).\
"""
stem = """
After this change, what makes every attempt to charge a payment carry the \
same operation key, a retry of the whole request included?\
"""
answer_key = "A"
why_it_matters = """
A timed-out charge may still have gone through, so a retry that carried a new \
key would let the provider charge the customer twice.\
"""
hint = """
Follow where the operation key on a charge request comes from, starting at \
`PaymentService::pay`.\
"""

[[candidate.options]]
letter = "A"
text = """
`ChargeRequest::new` now takes only the payment and copies the operation key \
the payment was created with, so no caller can pass a different key.\
"""
rationale = """
Right: `ChargeRequest::new(payment: &Payment)` sets `operation_key` to \
`payment.operation_key().clone()` (src/provider.rs, lines 29 to 31), and \
`pay` builds the request with `ChargeRequest::new(&payment)` (src/service.rs, \
line 57).\
"""

[[candidate.options]]
letter = "B"
text = """
`PaymentService::pay` keeps the key it generated for the first attempt and \
passes the same one again when the request is retried.\
"""
rationale = """
Wrong: the change removes `OperationKey::generate()` from `pay`, which now \
builds the request with `ChargeRequest::new(&payment)` and passes no key at \
all (src/service.rs, line 57).\
"""

[[candidate.options]]
letter = "C"
text = """
The provider client remembers the key of a charge that timed out, and reuses \
it when the same payment is charged again.\
"""
rationale = """
Wrong: `ProviderClient::charge` retries only the request it is given and \
keeps nothing between calls (src/provider.rs, lines 81 to 99); the key comes \
from the payment.\
"""

[[candidate.rubric]]
statement = "Explains that the key now comes from the payment itself, not from whoever charges it."
met = "Says the charge request takes the payment's own operation key, or that callers can no longer pass a key."
not_met = "Doesn't say where the key comes from, or says the service or the provider client chooses it."

[[candidate.rubric]]
statement = "Connects the unchanging key to the provider applying a payment's charge at most once."
met = "Says the provider deduplicates charges on the key, so attempts carrying the same key are one charge."
not_met = "Doesn't connect the key to the provider applying the charge once."

