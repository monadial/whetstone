note = """
Establishes criterion 1 only by implication: it never says the request \
copies the payment's key, but a request built from nothing but the payment, \
whose key is fixed when it is created, can carry no other. It says nothing \
of the provider (#135).\
"""
reasoning = """
Building a charge request now needs nothing but the payment, and a \
payment's key is fixed when the payment is created. So however many times \
the charge is retried, and from wherever, the key can't differ between \
attempts.\
"""
labels = { criterion_1 = "yes" }

