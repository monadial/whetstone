[package]
name = "payments"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A small multi-tenant payments service"
license = "Apache-2.0"
publish = false

# The service is its own workspace, so it builds on its own wherever it lives.
[workspace]

[dependencies]
axum = "0.8.9"
# Plain HTTP only: TLS to the provider terminates at the egress proxy.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
