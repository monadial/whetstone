# dist builds and publishes Whetstone's releases (ADR 0003), and generates
# `.github/workflows/release.yml` from this file. Change a setting here, then
# run `dist generate`; never edit release.yml by hand. CI fails when the two
# disagree. docs/releasing.md says how to cut a release.
# Reference: https://axodotdev.github.io/cargo-dist/book/reference/config.html

[workspace]
members = ["cargo:."]

[dist]
# Upgraded on purpose, in a PR of its own: install the new version, run
# `dist generate`, and re-pin the actions below to what it generates.
cargo-dist-version = "0.33.0"
ci = "github"
# The four platforms CI tests and the README supports. There is no Windows
# build.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
installers = ["shell"]
# Whetstone isn't a Cargo tool, and many learners have no ~/.cargo, so the
# installer uses the XDG bin directory, as uv's does.
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
install-updater = false
# A release runs only when a version tag is pushed, never on pull requests:
# the release gate below calls OpenRouter, which costs money.
pr-run-mode = "skip"
# The release gate: live.yml's live tests call Jev and the generator for
# real (CODING_STANDARDS.md, "The keyed end-to-end job"). dist calls the
# workflow with `secrets: inherit`, and every build job needs it, so a
# release fails, rather than going out unchecked, without the key.
plan-jobs = ["./live"]
github-attestations = true
# Every archive carries the licenses of the crates compiled into the binary,
# besides the README, LICENSE and CHANGELOG.md dist adds itself. The file
# isn't committed: the build setup below writes it with cargo-about
# (about.toml) before each build.
include = ["THIRD-PARTY-LICENSES.md"]
github-build-setup = "../build-setup.yml"

# Each target builds natively, as CI tests it, because the connected-code
# grammars and the TLS library compile C. Linux builds on the oldest Ubuntu
# runner GitHub offers, so the binaries run on as old a glibc as possible.
[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26-intel"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"

# The repository requires every action to be pinned to a full commit SHA
# (CODING_STANDARDS.md rule 45). dist writes these in place of the version
# tags it would use; checkout matches ci.yml's.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
