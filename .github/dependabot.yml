# Keeps the workflows' actions current. Each action is pinned to a full
# commit SHA with its version in a comment (CODING_STANDARDS.md rule 45), and
# Dependabot updates both. Crates are upgraded on purpose, in PRs of their own
# (rule 10), so Cargo isn't listed here; Dependabot's security updates still
# cover it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
