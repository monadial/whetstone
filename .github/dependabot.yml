# Keeps the workflows' actions current. Each action is pinned to a full
# commit SHA with its version in a comment (CODING_STANDARDS.md rule 45), and
# Dependabot updates both. Cargo isn't listed: several crates are pinned and
# upgraded on purpose (Rig under rule 10; cgg and gix, as
# crates/whetstone/Cargo.toml says), and Dependabot's security updates still
# cover every crate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # dist generates release.yml, and pins its actions from
    # dist-workspace.toml, which Dependabot doesn't read. docs/releasing.md
    # says when to update those pins by hand.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
