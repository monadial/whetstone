name: Showcase

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - "rust-toolchain.toml"
      - ".github/workflows/showcase.yml"
  pull_request:
    paths:
      - "showcase/**"
      - "rust-toolchain.toml"
      - ".github/workflows/showcase.yml"

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showcase:
    name: Build, test and replay the showcase project
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: showcase/payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: showcase/payments
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --offline --locked --all-targets
      - name: Test (offline)
        run: cargo test --offline --locked
      - name: Replay the curated history
        run: ../check-history.sh
