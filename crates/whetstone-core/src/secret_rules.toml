# The rules the secret check applies to what a Practice would send, and to
# the learner's reasoning before Submit response sends it. Whetstone embeds
# this file and reads it once, the first time text is checked; tests check
# it is valid and that every rule finds its example and not its
# counterexample, so a mistake here fails CI rather than a learner's review.
#
# To add a rule, add a `[[rule]]` table below and bump `version`. No code
# changes, apart from the test in `secret.rs` that lists every rule with its
# severity and the version, so that each change to the set is deliberate.
#
# `version` changes whenever a rule is added, removed or changed.
#
# Each rule has:
#
# - `name`: what its findings show, such as "GitHub token".
# - `severity`: what its match does to Send. `"blocking"` stops Send until
#   the learner resolves it: a provider's own key format, which is rarely
#   anything but a key. `"warning"` never stops Send: a generic pattern,
#   which often matches what isn't a secret. A warning that overlaps a
#   blocking match is dropped, since that match already stops Send.
# - `source`: where the format comes from, the provider's or the standard's
#   documentation, so a reviewer can check the pattern against it.
# - `pattern`: the regex, in `regex` crate syntax, as pieces joined in
#   order, split where that helps reading. Every format is ASCII, and the
#   crate leaves out `regex`'s Unicode tables, so use `(?-u:\b)` for a word
#   boundary and `(?i-u:...)` to ignore case. A capture group named `value`
#   makes the rule match only where that group isn't a placeholder (see
#   `placeholders` below).
# - `example` and `counterexample`: a fake secret the rule should find, and
#   a text it should find no secret in, each as pieces joined in order. The
#   pieces are harmless on their own, so GitHub push protection and other
#   secret scanners never find a whole fake secret in this file; it exists
#   whole only in the compiled binary.
#
# The rules are applied in this order: matches that start at the same place
# keep it. A finding never holds the matched value, only its first four
# characters, so a rule's match should start where those reveal nothing,
# such as at a key's prefix or a setting's name.

version = 2

# What stands in for a secret rather than being one. A rule's `value` group
# that one of these regexes matches whole, or that is one character
# repeated, such as `********`, is a placeholder, and the rule doesn't match
# there.
placeholders = [
    # Words that stand in for a value.
    '(?i-u:changeme|change[_-]me|replaceme|replace[_-]me|password|passwd|secret|token|example|placeholder|redacted|dummy|none|null)',
    # `your-api-key`, `YOUR_TOKEN_HERE`.
    '(?i-u:your).*',
    # `sk-...`, a value cut short in documentation.
    '.*(?:\.\.\.|…).*',
    # `settings.DB_PASSWORD`, a reference to another setting.
    '[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+',
    # `${DB_PASSWORD}`, in shells, Compose files and many templates.
    '\$\{[^}]*\}',
    # `$DB_PASSWORD`, an environment variable.
    '\$[A-Za-z_][A-Za-z0-9_]*',
    # `{{ db_password }}`, in Jinja, Go and Helm templates.
    '\{\{.*\}\}',
    # `{password}`, in Python's f-strings and Rust's `format!`.
    '\{[^}]*\}',
    # `[REDACTED]`, in logs and documentation.
    '\[[^\]]*\]',
    # `<password>`, in documentation.
    '<[^>]*>',
    # `%(password)s`, in Python's format strings.
    '%\([^)]*\)s',
]

# A PEM private key block, from its `BEGIN` line to its `END` line. Between
# the boundaries, the block holds no quote and no run of dashes: that finds
# a key in a diff, in YAML or in JSON with escaped newlines, but not code
# that only names the boundaries, and never runs from an unfinished block
# into the next one. A removed line in a diff puts one more dash before
# `-----END`. The `END` label isn't checked against the `BEGIN` label,
# because `regex` has no backreferences.
[[rule]]
name = "PEM private key"
severity = "blocking"
source = """
RFC 7468 section 2 (https://www.rfc-editor.org/rfc/rfc7468), whose \
encapsulation boundaries are `-----BEGIN label-----` and `-----END \
label-----`, with the labels `PRIVATE KEY` and `ENCRYPTED PRIVATE KEY`. It \
also covers OpenSSL's older labels (`RSA PRIVATE KEY`, `EC PRIVATE KEY`), \
OpenSSH's `OPENSSH PRIVATE KEY` (`sshkey.c`) and OpenPGP's `PGP PRIVATE KEY \
BLOCK` armor (RFC 9580 section 6.2.1, \
https://www.rfc-editor.org/rfc/rfc9580), which has the same shape."""
pattern = [
    '-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY(?: BLOCK)?-----',
    '''(?:[^-"'`]|-[^-"'`])*?''',
    '-?-----END (?:[A-Z0-9]+ )*PRIVATE KEY(?: BLOCK)?-----',
]
example = ["-----BEGIN ", "PRIVATE KEY-----\nFAKE\n-----END ", "PRIVATE KEY-----"]
counterexample = ["-----BEGIN ", "PUBLIC KEY-----\nFAKE\n-----END ", "PUBLIC KEY-----"]

# An AWS access key ID: `AKIA` (long-term) or `ASIA` (temporary, from STS)
# and 16 more uppercase letters and digits.
[[rule]]
name = "AWS access key ID"
severity = "blocking"
source = """
AWS IAM User Guide, "IAM identifiers" \
(https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html), \
whose table of unique ID prefixes lists `AKIA` for access keys and `ASIA` \
for temporary ones. The IAM API reference allows any 16 to 128 word \
characters (https://docs.aws.amazon.com/IAM/latest/APIReference/API_AccessKey.html); \
the 20 characters here fit AWS's example key ID and gitleaks' rule."""
pattern = ['(?-u:\b)(?:AKIA|ASIA)[A-Z0-9]{16}(?-u:\b)']
example = ["AKIA", "FAKEFAKEFAKEFAKE"]
counterexample = ["AKIA", "FAKEFAKE"]

# A GitHub token: `ghp_` (personal access token), `gho_` (OAuth), `ghu_`
# (user-to-server), `ghs_` (server-to-server), `ghr_` (refresh) or
# `github_pat_` (fine-grained personal access token).
[[rule]]
name = "GitHub token"
severity = "blocking"
source = """
GitHub Docs, "About authentication to GitHub" \
(https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github), \
section "GitHub's token formats", which lists the prefixes, and the GitHub \
blog post "Behind GitHub's new authentication token formats" (2021): 30 \
random Base62 characters and a 6-character checksum after the prefix. \
Tokens may grow to 255 characters, and since April 2026 installation tokens \
(`ghs_`) can be about 520 characters with `.` and `-` (GitHub changelog, 24 \
April 2026), so no upper bound is set. The 82-character body of \
`github_pat_` follows gitleaks, because GitHub doesn't document it."""
pattern = [
    '(?-u:\b)(?:gh[pour]_[A-Za-z0-9_]{36,}|ghs_[A-Za-z0-9_.-]{36,}|github_pat_[A-Za-z0-9_]{82,})',
]
example = ["ghp_", "FAKEfakeFAKEfakeFAKEfakeFAKEfakeFAKE"]
counterexample = ["ghp_", "FAKEfakeFAKE"]

# A GitLab personal access token: `glpat-` and at least 20 characters. The
# newer routable tokens carry a longer Base64 payload after the same prefix,
# which this also matches.
[[rule]]
name = "GitLab personal access token"
severity = "blocking"
source = """
GitLab Docs, "Token prefixes" in https://docs.gitlab.com/security/tokens/ \
(`glpat-` for personal, project, group and impersonation tokens), and \
https://docs.gitlab.com/user/profile/personal_access_tokens/, which says \
the token is 20 characters long; the GitLab handbook, "Routable tokens", \
for the longer payload."""
pattern = ['(?-u:\b)glpat-[0-9A-Za-z_-]{20,}']
example = ["glpat-", "FAKEfakeFAKEfakeFAKE"]
counterexample = ["glpat-", "FAKEfake"]

# A Slack token: `xoxb-` (bot), `xoxp-` (user), `xapp-` (app-level),
# `xwfp-` (workflow) or another `xox?-` type, optionally with the `xoxe.`
# prefix of a rotating token.
[[rule]]
name = "Slack token"
severity = "blocking"
source = """
Slack API docs, https://docs.slack.dev/authentication/tokens and \
https://docs.slack.dev/authentication/using-token-rotation, which list the \
prefixes and ask integrators to expect up to 255 characters and not to rely \
on any other structure. The older `xoxa-`, `xoxo-`, `xoxr-` and `xoxs-` \
types follow gitleaks."""
pattern = ['(?-u:\b)(?:xoxe\.)?(?:xox[abeoprs]|xapp|xwfp)-[0-9A-Za-z-]{10,}']
example = ["xoxb-", "FAKEFAKEFA"]
counterexample = ["xoxb-", "FAKE"]

# A Stripe live secret key (`sk_live_`) or restricted key (`rk_live_`).
# Test-mode keys (`_test_`) are left out: they can't move money.
[[rule]]
name = "Stripe live key"
severity = "blocking"
source = """
Stripe Docs, "API keys" (https://docs.stripe.com/keys), which gives the \
prefixes. Stripe documents no length; the 10-character minimum follows \
gitleaks."""
pattern = ['(?-u:\b)[rs]k_live_[0-9A-Za-z]{10,}']
example = ["sk_live_", "FAKEFAKEFA"]
counterexample = ["sk_test_", "FAKEFAKEFA"]

# A Google API key: `AIza` and 35 letters, digits, `-` or `_`.
[[rule]]
name = "Google API key"
severity = "blocking"
source = """
Google Cloud docs (https://cloud.google.com/docs/authentication/api-keys), \
whose example key starts with `AIza`. Google publishes no length; the \
39-character format follows Microsoft Purview's "Google API key" sensitive \
information type."""
pattern = ['(?-u:\b)AIza[0-9A-Za-z_-]{35}']
example = ["AIza", "FAKEfakeFAKEfakeFAKEfakeFAKEfakeFAK"]
counterexample = ["AIza", "FAKEfake"]

# An OpenRouter API key: `sk-or-v1-` and 64 lowercase hexadecimal digits.
[[rule]]
name = "OpenRouter API key"
severity = "blocking"
source = """
OpenRouter docs \
(https://openrouter.ai/docs/guides/features/guardrails/secret-formats), \
which give this format."""
pattern = ['(?-u:\b)sk-or-v1-[0-9a-f]{64}']
example = ["sk-or-v1-", "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"]
counterexample = ["sk-or-v1-", "deadbeef"]

# An Anthropic API key (`sk-ant-api03-`), Admin API key (`sk-ant-admin01-`)
# or other `sk-ant-` key with a type and version. Keys seen so far have 95
# characters after the prefix, so a minimum of 32 keeps a shorter future
# format from slipping through.
[[rule]]
name = "Anthropic API key"
severity = "blocking"
source = """
Claude Docs, https://platform.claude.com/docs/en/get-api-key and \
https://platform.claude.com/docs/en/manage-claude/admin-api-keys, which \
give the prefixes. Anthropic documents no length."""
pattern = ['(?-u:\b)sk-ant-[a-z]{3,5}[0-9]{2}-[A-Za-z0-9_-]{32,}']
example = ["sk-ant-", "api03-", "FAKEfakeFAKEfakeFAKEfakeFAKEfake"]
counterexample = ["sk-ant-", "api03-", "FAKEfake"]

# An OpenAI API key: `sk-`, `sk-proj-`, `sk-svcacct-` or `sk-admin-`, with
# the marker `T3BlbkFJ` (Base64 for "OpenAI") in the middle. A key without
# the marker is missed.
[[rule]]
name = "OpenAI API key"
severity = "blocking"
source = """
OpenAI publishes no key format. The prefixes are those its dashboard \
issues, and the marker follows gitleaks' `openai-api-key` rule \
(https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml)."""
pattern = [
    '(?-u:\b)sk-(?:(?:proj|svcacct|admin)-)?[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}',
]
example = ["sk-", "FAKEfakeFAKEfakeFAKE", "T3Blbk", "FJ", "FAKEfakeFAKEfakeFAKE"]
counterexample = ["sk-", "FAKEfakeFAKEfakeFAKEfakeFAKEfakeFAKEfake"]

# A URL with a password in it, such as a database's connection string: a
# scheme, `://`, a user name, which may be empty, `:`, the password and `@`.
# The match starts at the scheme, so its excerpt never shows the password.
[[rule]]
name = "Password in a URL"
severity = "warning"
source = """
RFC 3986 section 3.2.1 (https://www.rfc-editor.org/rfc/rfc3986), whose \
userinfo is `user:password`, a format it deprecates because it sends the \
password in clear text. The password can't hold `/`, `?`, `#` or `@` \
unencoded (section 3.2), so the match ends at the first `@`."""
pattern = [
    '''(?-u:\b)[A-Za-z][A-Za-z0-9+.-]*://[^:/?#@ \t\r\n"'`]*:''',
    '''(?P<value>[^/?#@ \t\r\n"'`]+)@''',
]
example = ["postgres://app:", "hunter2@db.internal/app"]
counterexample = ["postgres://app:", "${DB_PASSWORD}@db.internal/app"]

# A signed JSON Web Token: three base64url parts joined by dots, the first
# two JSON objects, so each starts with `eyJ`, the encoding of `{"`. An
# unsecured token has no signature and proves nothing, so it doesn't match.
[[rule]]
name = "JSON Web Token"
severity = "warning"
source = """
RFC 7519 section 3 (https://www.rfc-editor.org/rfc/rfc7519), which encodes \
a token with JWS Compact Serialization, RFC 7515 section 7.1 \
(https://www.rfc-editor.org/rfc/rfc7515): the header, the payload and the \
signature, each base64url-encoded without padding. RFC 7519 section 6 \
defines the unsecured token, with an empty signature."""
pattern = ['(?-u:\b)eyJ[A-Za-z0-9_-]{7,}\.eyJ[A-Za-z0-9_-]{7,}\.[A-Za-z0-9_-]{16,}']
example = ["eyJhbGciOiJIUzI1NiJ9", ".eyJzdWIiOiJmYWtlIn0", ".FAKEfakeFAKEfakeFAKEfake"]
counterexample = ["eyJhbGciOiJub25lIn0", ".eyJzdWIiOiJmYWtlIn0."]

# A quoted literal of at least 6 characters, without spaces, assigned to a
# name that ends in `password`, `passwd`, `secret`, `token` or `api_key`,
# optionally followed by `key` or `access_key`, ignoring case:
# `DB_PASSWORD = "…"`, `"api_key": "…"`, `const API_KEY: &str = "…"`,
# `token := "…"` or `'client_secret' => '…'`. The match starts at the name,
# so its excerpt never shows the value. A value with a space isn't matched,
# since it is far more often a label than a secret, and an unquoted one is
# the next rule's.
[[rule]]
name = "Literal assigned to a secret name"
severity = "warning"
source = """
CWE-798, "Use of Hard-coded Credentials" \
(https://cwe.mitre.org/data/definitions/798.html), whose examples assign a \
password literal to a named variable or setting."""
pattern = [
    '(?-u:\b)[A-Za-z0-9_.-]*?',
    '(?i-u:password|passwd|secret|token|api[_-]?key)',
    '(?i-u:[_-]?access[_-]?key|[_-]?key)?',
    '''["']?[ \t]*''',
    '''(?::[ \t]*|(?::[^=:"\r\n]{1,40})?(?:=>|:=|=)[ \t]*)''',
    '''["'`](?P<value>[^"'`\x00-\x20]{6,})["'`]''',
]
example = ["DB_PASSWORD = \"", "hunter2\""]
counterexample = ["DB_PASSWORD = \"", "${DB_PASSWORD}\""]

# An unquoted value of at least 6 characters, to the end of its line, set
# for the same names as the rule before, the way configuration sets one:
# after `:`, as YAML and Compose files do (`POSTGRES_PASSWORD: …`,
# `password: …`), or after `=` for a name in capitals, as environment
# files, shells and Dockerfiles do (`ENV DB_PASSWORD=…`). A comment may
# follow it. Code that assigns a variable to a lowercase name, such as
# `password = new_password`, isn't matched, nor is a value with a space, a
# quote, a bracket, a call, a `,` or a `;`, or one that starts with `$`.
[[rule]]
name = "Unquoted value assigned to a secret name"
severity = "warning"
source = """
CWE-798, "Use of Hard-coded Credentials" \
(https://cwe.mitre.org/data/definitions/798.html), and the Compose file \
reference's `environment` attribute \
(https://docs.docker.com/reference/compose-file/services/#environment), \
whose values are set unquoted, as a Dockerfile's `ENV` and an environment \
file's are."""
pattern = [
    '(?m)(?-u:\b)(?:',
    '[A-Za-z0-9_.-]*?(?i-u:password|passwd|secret|token|api[_-]?key)',
    '(?i-u:[_-]?access[_-]?key|[_-]?key)?[ \t]*:',
    '|',
    '[A-Z0-9_]*?(?:PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY)(?:_?ACCESS_?KEY|_?KEY)?[ \t]*=',
    ')',
    '''[ \t]*(?P<value>[^\x00-\x20"'`#$(){}\[\],;][^\x00-\x20"'`#(){}\[\],;]{5,})''',
    '[ \t]*(?:#[^\r\n]*)?\r?$',
]
example = ["    POSTGRES_PASSWORD: ", "hunter2"]
counterexample = ["DB_PASSWORD=", "${DB_PASSWORD}"]

# The start of a PEM private key: its `BEGIN` line, then at least 16
# characters of its base64 body, with only line breaks, escaped or not,
# spaces, quotes, `+` and `,` between them. It finds a key split across
# string literals, or one whose `END` line isn't in the text, such as in a
# diff's hunk, which "PEM private key" can't. Code that only names the
# `BEGIN` line has no base64 after it.
[[rule]]
name = "Start of a PEM private key"
severity = "warning"
source = """
RFC 7468 section 2 (https://www.rfc-editor.org/rfc/rfc7468), whose \
encapsulated text is base64, with the labels "PEM private key" gives."""
pattern = [
    '-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY(?: BLOCK)?-----',
    '''(?:\\[rn]|[ \t\r\n"'`+,])*[A-Za-z0-9+/]{16,}''',
]
example = ["\"-----BEGIN ", "PRIVATE KEY-----\\n\"\n\"", "FAKEfakeFAKEfakeFAKEfake\\n\""]
counterexample = ["const HEADER: &str = \"-----BEGIN ", "PRIVATE KEY-----\\n\";"]
