[package]
name = "whetstone-core"
description = "Domain types for Whetstone Practice, with no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Secret rules and exclude patterns compile to regular expressions. None
# needs a Unicode class or case table (an exclude pattern's literal text may
# be any UTF-8), so the tables are left out to keep the binary small; `perf`
# keeps scanning a 400 KB change fast.
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }
# The default exclusions and the secret rules are data, read from embedded
# TOML files into their types. Already in the tree through the other crates.
serde = { version = "1", features = ["derive"] }
# Each module that can fail has its own error type (CODING_STANDARDS.md rule 13).
thiserror = "2"
# Area files carry TOML front matter, as the config files do; the binary
# already depends on both crates.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
