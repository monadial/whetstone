[package]
name = "whetstone-core"
description = "Domain types for Whetstone Practice, with no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Area files carry TOML front matter, as the config files do; the binary
# already depends on both crates.
[dependencies]
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
