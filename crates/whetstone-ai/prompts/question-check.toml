# The question check: Jev's questions about one candidate question, which
# the state holds as `candidate`, beside the `evidence`. Each yes/no question
# has its instructions and what yes and no mean; the depth score has its
# instructions and its levels, the shallowest first.
#
# Placeholders: `{letter}` is an option's letter, and `{criterion}` is a
# criterion's name in the candidate's rubric, such as `criterion_1`.

[answerable]
instructions = "The candidate's stem can be answered from the evidence alone: everything needed to choose the correct option and explain why is in the evidence."
yes = "The evidence holds everything needed to answer the stem and explain the answer."
no = "Answering the stem needs something the evidence doesn't show."

[about_area]
instructions = "The candidate is about its area, as the area's name and description define it."
yes = "The question asks about what the area's name and description cover."
no = "The question asks about something outside the area, or touches it only in passing."

[needs_change]
instructions = "Answering the candidate needs this change: someone with general programming knowledge, but without the evidence, couldn't choose the correct option with confidence."
yes = "Choosing the correct option needs understanding what the change does."
no = "General knowledge alone is enough to choose the correct option."

[no_giveaway]
instructions = "The candidate's stem and options don't give the answer away: no option stands out as correct or wrong from its wording, length, detail or how it echoes the stem. Judge the stem and the options' text as the learner sees them before answering, without the answer key, rationales or hint."
yes = "Nothing in the wording of the stem or options points to the correct option."
no = "The wording of the stem or options points to the correct option, or rules options out."

[criterion]
instructions = "Rubric criterion {criterion} of the candidate follows from the evidence and the answer key, and whether a learner's written reasoning meets it can be judged from the reasoning alone."
yes = "The criterion follows from the evidence and the answer key, and written reasoning can show whether it is met."
no = "The criterion doesn't follow from the evidence and the answer key, or written reasoning can't show whether it is met."

[option]
instructions = "Given the evidence, option {letter} correctly answers the candidate's stem. Judge it from the evidence alone, not from the candidate's answer key or rationales."
yes = "The evidence shows that option {letter} is a correct answer to the stem."
no = "The evidence doesn't show that option {letter} answers the stem correctly, or shows that it doesn't."

[rationale]
instructions = "The candidate's rationale for option {letter}, which explains why that option is correct or wrong, is supported by the evidence. Judge the rationale, not the option: a rationale that rightly explains why a wrong option is wrong is supported."
yes = "The evidence supports what the rationale for option {letter} says about why the option is correct or wrong."
no = "The rationale for option {letter} says something about the option or the change that the evidence doesn't support, or contradicts."

[why_it_matters]
instructions = "The candidate's \"why it matters\" line is supported by the evidence."
yes = "The evidence supports what the \"why it matters\" line says."
no = "The \"why it matters\" line says something the evidence doesn't support, or contradicts."

[hint_points_to_evidence]
instructions = "The candidate's hint points to where in the evidence to look for the answer."
yes = "The hint points to specific parts of the evidence that bear on the answer."
no = "The hint is vague, or points to nothing in the evidence that bears on the answer."

[hint_hides_answer_key]
instructions = "The candidate's hint doesn't reveal the answer key: someone reading only the stem, the options and the hint couldn't tell which option is correct."
yes = "The hint leaves the learner to work out which option is correct."
no = "The hint reveals which option is correct, or rules options out."

# Depth only orders questions, deepest first: it never passes or fails one.
[depth]
instructions = "How much understanding of the change answering the candidate's stem needs."
levels = [
    "Answerable by reading one line",
    "Needs reading the change",
    "Needs an understanding of how the change affects the code around it",
]
