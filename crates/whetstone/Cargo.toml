[package]
name = "whetstone"
description = "Practice understanding supplied work through questions and written reasoning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Finds the repository paths a change names with one multi-pattern search
# over every path in the commit's tree. Already in the tree through `regex`,
# with the same default features.
aho-corasick = "1.1"
anyhow = "1"
# Finds connected code (ADR 0002): what a change's functions call and what
# calls them, in 46 languages, resolved by scope, imports and receiver type,
# with a confidence on every edge. It is pre-1.0 and its options gain fields
# with new releases, so it is pinned exactly and upgraded on purpose, with the
# showcase project's expected connected code checked on every upgrade. Only
# the `connected_code` module uses it. Its grammars compile C, and every
# tree-sitter use in Whetstone must share its tree-sitter version.
cgg = "=0.11.0"
# cgg's own language detector and its walker's deny list, so that only the
# files cgg reads are written out for it. Already in the tree through cgg, and
# pinned with it: upgrade all three together.
cgg-lang = "=0.11.0"
cgg-walk = "=0.11.0"
clap = { version = "4.6", features = ["derive"] }
# Only turns on `event-stream` in the crossterm that ratatui re-exports, so
# the UI loop can read terminal input as an async stream. The code uses it
# through `ratatui::crossterm`, so the version must stay ratatui's.
crossterm = { version = "0.29", default-features = false, features = ["event-stream"] }
# Compresses cached connected-code graphs. Built on the `zlib-rs` backend,
# which gix already brings, so no second deflate implementation is added.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# `StreamExt::next` reads crossterm's `EventStream`. Already in the tree
# through tokio-util.
futures-util = { version = "0.3", default-features = false }
# Reads the learner's repository: discovery, objects, refs, history and
# diffs, in pure Rust and built without network or transport features.
# `sha1` is the only hash it needs, and gix will not build without one.
# `blob-diff` is the smallest feature with tree diffs that track renames
# and unified line diffs. gix makes a breaking 0.x release about monthly, so
# the minor version is pinned and upgraded on purpose.
gix = { version = "0.89", default-features = false, features = ["sha1", "blob-diff"] }
# Reads the links in touched Markdown as CommonMark defines them, with
# reference links resolved and source positions for each. Without default
# features it is the parser alone, with no HTML renderer and no command-line
# options.
pulldown-cmark = { version = "0.13", default-features = false }
# `Paragraph::line_count` sizes wrapped text so no control is pushed off a
# short screen. Ratatui exempts `unstable-*` features from semver, so check it
# still builds when moving off the locked 0.30.x.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
# Suspends as vim does, through safe calls: stops the whole process group,
# after checking a job-control shell is there to continue it. Already in the
# tree through crossterm and gix.
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
# Cached connected-code graphs are stored as JSON, through their serde
# implementations.
serde_json = "1"
signal-hook = "0.3"
# The private directory a commit's files are written to for cgg: created
# mode 0700 with an unpredictable name, and removed on drop, even while a
# panic unwinds. Also writes a cached graph to a temporary file in the cache
# folder, then renames it into place, so a crash never leaves a half-written
# graph. Already in the tree as a dev-dependency.
tempfile = "3"
thiserror = "2"
# The UI loop's runtime: one thread (`rt`) waiting with `select!` (`macros`)
# on input, signals (`signal`), the bounded channel of job results (`sync`)
# and the tick while a job runs (`time`). Background jobs run on its
# blocking threads (CODING_STANDARDS.md rules 16 to 21).
tokio = { version = "1.53", features = ["macros", "rt", "signal", "sync", "time"] }
# Owns background jobs (`TaskTracker`, from `rt`) and cancels them
# (`CancellationToken`).
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Typed text is edited by grapheme (CODING_STANDARDS.md rule 31). Ratatui
# already depends on it.
unicode-segmentation = "1.13"
whetstone-core = { path = "../whetstone-core" }

# build.rs replays the showcase project's patch series into embedded data.
[build-dependencies]
thiserror = "2"
whetstone-core = { path = "../whetstone-core" }

[dev-dependencies]
assert_cmd = "2.2"
insta = "1.49"
tempfile = "3"
# Time-dependent async tests use a paused clock (CODING_STANDARDS.md rule 49).
tokio = { version = "1.53", features = ["test-util"] }

[target."cfg(unix)".dev-dependencies]
rexpect = "0.7"

# crossterm is a dependency only to turn on a feature; the code reaches it
# through ratatui's re-export.
[package.metadata.cargo-shear]
ignored = ["crossterm"]
